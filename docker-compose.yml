version: '3.8'

services:
  # ========================================
  # BASE DE DONNÉES POSTGRESQL
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_app
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=fr_FR.UTF-8 --lc-ctype=fr_FR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - saas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # CACHE REDIS
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================
  # APPLICATION BACKEND
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: saas_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      
      # Base de données
      DATABASE_URL: postgresql://saas_user:saas_password@postgres:5432/saas_app
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      REDIS_DB: 0
      
      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      JWT_REFRESH_EXPIRES_IN: 7d
      
      # Sécurité
      BCRYPT_ROUNDS: 12
      MAX_LOGIN_ATTEMPTS: 5
      ACCOUNT_LOCKOUT_TIME: 1800000
      
      # Rate limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # CORS
      CORS_ORIGIN: http://localhost:3000
      
      # Logs
      LOG_LEVEL: debug
      
      # 2FA
      TOTP_SERVICE_NAME: SaaS App
      TOTP_ISSUER: Your Company
      
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
    networks:
      - saas_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # APPLICATION FRONTEND (NEXT.JS)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: saas_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_NAME: SaaS App
      NEXT_PUBLIC_APP_VERSION: 1.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - saas_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # WORKER POUR LES TÂCHES ASYNCHRONES
  # ========================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: saas_worker
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: development
      
      # Base de données
      DATABASE_URL: postgresql://saas_user:saas_password@postgres:5432/saas_app
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      REDIS_DB: 0
      
      # Logs
      LOG_LEVEL: debug
      
    volumes:
      - ./backend:/app
      - /app/node_modules
      - worker_logs:/app/logs
    networks:
      - saas_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========================================
  # ADMINER (INTERFACE DB - DÉVELOPPEMENT UNIQUEMENT)
  # ========================================
  adminer:
    image: adminer:4-standalone
    container_name: saas_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - saas_network
    depends_on:
      - postgres
    profiles:
      - dev

  # ========================================
  # REDIS COMMANDER (INTERFACE REDIS - DÉVELOPPEMENT UNIQUEMENT)
  # ========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: saas_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_password
    ports:
      - "8081:8081"
    networks:
      - saas_network
    depends_on:
      - redis
    profiles:
      - dev

# ========================================
# VOLUMES PERSISTANTS
# ========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  worker_logs:
    driver: local

# ========================================
# RÉSEAU
# ========================================
networks:
  saas_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

